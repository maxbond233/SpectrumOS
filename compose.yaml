name: spectrum-v05
x-runtime: &runtime
  build: .
  env_file: .env
  environment: &runtime-env
    SPECTRUM_DATABASE_URL: postgresql+psycopg://spectrum:${SPECTRUM_POSTGRES_PASSWORD:-spectrum}@postgres:5432/spectrum
    SPECTRUM_REDIS_URL: redis://redis:6379/0
    SPECTRUM_S3_ENDPOINT: http://storage:9000
    SPECTRUM_S3_SECRET_KEY: ${SPECTRUM_S3_SECRET_KEY:-spectrum-local-storage}
    SPECTRUM_API_TOKEN: ${SPECTRUM_API_TOKEN:-}
  volumes: ["models:/app/.work/models"]
  profiles: ["app"]
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: spectrum
      POSTGRES_PASSWORD: ${SPECTRUM_POSTGRES_PASSWORD:-spectrum}
      POSTGRES_DB: spectrum
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectrum"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: spectrum
      MINIO_ROOT_PASSWORD: ${SPECTRUM_S3_SECRET_KEY:-spectrum-local-storage}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["objects:/data"]
  migrate:
    <<: *runtime
    command: ["spectrum", "migrate"]
    depends_on:
      postgres: {condition: service_healthy}
      storage: {condition: service_started}
  api:
    <<: *runtime
    environment:
      <<: *runtime-env
      SPECTRUM_HOST: 0.0.0.0
    ports: ["127.0.0.1:8078:8078"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *runtime
    command: ["celery", "-A", "spectrum.orchestrator.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=3"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  beat:
    <<: *runtime
    command: ["spectrum", "beat"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build: frontend
    profiles: ["app"]
    environment:
      SPECTRUM_API_URL: http://api:8078
      SPECTRUM_API_TOKEN: ${SPECTRUM_API_TOKEN:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres:
  redis:
  objects:
  models:
